name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests
        run: dotnet test .\ScreenshotDirector.sln -c Release

      - name: Publish Single-File Executable (win-x64)
        run: >
          dotnet publish .\src\ScreenshotDirector\ScreenshotDirector.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish\win-x64

      - name: Package ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\win-x64\ScreenshotDirector.exe -DestinationPath .\publish\ScreenshotDirector-${{ github.ref_name }}-win-x64.zip -Force

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Screenshot Director ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .\publish\ScreenshotDirector-${{ github.ref_name }}-win-x64.zip
            .\publish\win-x64\ScreenshotDirector.exe
